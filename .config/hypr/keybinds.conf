################
### Keybinds ###
################

$terminal = kitty # add your favorite terminal emulator
$fileManager = nautilus # add your favorite file manager
$rofi = ~/.config/rofi/launcher.sh # add your rofi menu theme
$rofiStyle = ~/.config/rofi/rofiselect.sh # change rofi style
$mainMod = SUPER # Sets "Windows" key as main modifier
$powerMenu = ~/.config/hypr/scripts/PowerMenu.sh

####################################################################

# Basic keybinds
bind = $mainMod, Return, exec, $terminal

bind = $mainMod ALT, Return, exec, [float; size 700 700] kitty

bind = $mainMod ALT, A, exec, ~/.config/hypr/scripts/audio_switch.sh #launch audio device switcher (rofi)

bind = $mainMod, Q, killactive #kill opened window

bind = $mainMod SHIFT ,ESC, exit, #exit hyprland

bind = SHIFT ALT, B, exec, firefox # launch firefox

bind = SHIFT ALT, S, exec, spotify # launch spotify

bind = SHIFT ALT, N, exec, $fileManager # launch thunar

#bind = $mainMod ALT, N, exec, ~/.config/hypr/scripts/Hypr-Net # Launch rofi netmanger
bind = $mainMod ALT, N, exec, better-control --minimal --wifi # better-control wifi


bind = $mainMod, V, togglefloating, #set focused window to float

bind = $mainMod, Space, exec, $rofi

bind = $mainMod SHIFT, S, exec, $rofiStyle

bind = $mainMod, P, pseudo, # dwindle

bind = $mainMod, J, togglesplit, # dwindle

bind = $mainMod ALT,P,exec,$powerMenu #power-menu

bind = $mainMod SHIFT,R,exec,hyprctl reload #reload hyprland

bind = $mainMod ALT,C,exec, ~/.config/hypr/scripts/Clipboard.sh #launch rofi-clipboard


#######################################################################

# Move focus with mainMod shift + arrow keys
bind = $mainMod SHIFT , left, movefocus, l

bind = $mainMod SHIFT, right, movefocus, r

bind = $mainMod SHIFT, up, movefocus, u

bind = $mainMod SHIFT, down, movefocus, d

######################################################################

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1

bind = $mainMod, 2, workspace, 2

bind = $mainMod, 3, workspace, 3

bind = $mainMod, 4, workspace, 4

bind = $mainMod, 5, workspace, 5

bind = $mainMod, 6, workspace, 6

bind = $mainMod, 7, workspace, 7

bind = $mainMod, 8, workspace, 8

bind = $mainMod, 9, workspace, 9

bind = $mainMod, 0, workspace, 10

#######################################################################

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1

bind = $mainMod SHIFT, 2, movetoworkspace, 2

bind = $mainMod SHIFT, 3, movetoworkspace, 3

bind = $mainMod SHIFT, 4, movetoworkspace, 4

bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = $mainMod SHIFT, 6, movetoworkspace, 6

bind = $mainMod SHIFT, 7, movetoworkspace, 7

bind = $mainMod SHIFT, 8, movetoworkspace, 8

bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind = $mainMod SHIFT, 0, movetoworkspace, 10

###################################################################

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1

bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow

#bindm = mouse:272, exec, $terminal

# Wallpaper selector
bind = $mainMod, W,exec, walset

#increase brightness
bind = ,XF86MonBrightnessUp,exec,~/.config/hypr/scripts/brightness_control.sh increase

# decrease brightness
bind = ,XF86MonBrightnessDown,exec ,~/.config/hypr/scripts/brightness_control.sh decrease

#increase/decrease/mute audio
binde = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/Volume.sh --inc

binde = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/Volume.sh --dec

bind =, XF86AudioMute, exec, Volume --toggle

# Reload waybar
bind = $mainMod Alt ,R, exec, ~/.config/waybar/launch.sh

# Take screenshot [using grim]
bind = ,Print,exec, ~/.config/hypr/scripts/Screenshot.sh

# launch ntui / network manager
bind = $mainMod, X, exec, [float; size 800 800] kitty -e nmtui

# launch rofi bluetooth

bind = $mainMod Alt, B, exec, ~/.config/hypr/scripts/rofi-bluetooth.sh

# launch waypaper

bind = $mainMod ALT, W, exec, ~/.config/hypr/scripts/rofi-waybar.sh

# Resize active window
bind = $mainMod CTRL, left, resizeactive, -20 0

bind = $mainMod CTRL, right, resizeactive, 20 0

bind = $mainMod CTRL, up, resizeactive, 0 -20

bind = $mainMod CTRL, down, resizeactive, 0 20

# Force kill selected app
bind = $mainMod SHIFT, K, exec, xkill

# move active window to next/prev workspace
 bind = $mainMod ALT, right, movetoworkspace, +1
 bind = $mainMod ALT, left, movetoworkspace, -1

# Cycle throught workspace using mainMod + right/left arrow
 bind = $mainMod, right,workspace, +1
 bind = $mainMod, left,workspace, -1

# custom [Add your own extra keybinds]

bind = SUPER, O, hyprexpo:expo, toggle
bind = $mainMod ALT, f, exec, ~/.config/hypr/scripts/noPanel.sh

### END OF FILE ###
