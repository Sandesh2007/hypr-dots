#### Auto start apps and other components #### ![Imp]!

# reload all hyprland plugins
exec-once = hyprpm reload -n

#Notify about updates
exec-once = ~/.config/hypr/scripts/notify-updates.sh

# start gnome authenticator
#exec-once = pidof -q polkit-gnome-authentication-agent-1 || { /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 & }

# Start hyprland authenticator
exec-once = systemctl --user start hyprpolkitagent

# start dunst
# exec-once = dunst -config "$HOME"/.config/hypr/dunstrc &
exec-once = swaync

exec-once = systemctl --user enable dunst

exec-once = hypridle

exec-once = wl-paste --type text --watch cliphist store

exec-once = wl-paste --type image --watch cliphist store

exec-once = eww -c "$HOME"/.config/hypr/eww daemon &

exec-once = swww-daemon

exec-once = ~/.config/waybar/launch.sh

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=hyprland

exec-once = systemctl --user start xdg-desktop-portal &

exec-once = ~/.config/hypr/scripts/xdg.sh

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = blueman-applet

# start conky
# exec-once = ags run ~/.config/ags-gtk4/widgets/conky --gtk4

exec-once = libinput-gestures-setup start &

# enable hyprshade
exec-once = sleep 2; ~/.config/hypr/scripts/hyprshade.sh
