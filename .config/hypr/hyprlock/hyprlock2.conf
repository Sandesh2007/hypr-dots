source = $HOME/.cache/wal/colors-hyprland.conf
general{
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.cache/current_wallpaper.png  # only png supported for now
    # path= screenshot 
    color = $color7
    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 5
    blur_passes = 2 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Password field
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 1.00 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(245, 245, 240, 1)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = $color7
    fade_on_empty = false
    placeholder_text=<i><span foreground="##22223b"> $USER</span></i> # Text rendered in the input box when it's empty.
    hide_input = false
    position = 0, 390
    rounding = -1
    halign = center
    valign = bottom
}

#  Profile image
image {
  monitor =
  halign = center
  path = $HOME/.config/hypr/profile_images/red_samurai.jpg
  position = 0, 70
  size = 200
  valign = center
}

# Battery percentage
label {
  monitor =
  color=rgba(242, 243, 244, 0.75)
  font_family=JetBrains Mono
  font_size=17
  text = cmd[update:5000] echo "<span>Battery: <span foreground='##fff'>$(get_battery_percentage.sh percentage) </span></span>"
  position = 0, 0
  valign = top
  halign = left
}

# Battery state 
label {
  monitor =
  color=rgba(242, 243, 244, 0.75)
  font_family=JetBrains Mono
  font_size=17
  text = cmd[update:1000] echo "<span>State: <span foreground='##fff'>$(get_battery_percentage.sh state)</span></span>"
  position = 0, -30
  valign = top
  halign = left
}

# Name
label {
  monitor=
  color=rgba(242, 243, 244, 0.75)
  font_family=JetBrains Mono
  font_size=22
  halign=center
  position=0, -50
  text=Hi, I am $USER
  valign=center
}

# Current time

label {
  monitor=
  color=rgba(242, 243, 244, 0.75)
  font_family=JetBrains Mono
  font_size=95
  halign=center
  position=0, 300
  text = cmd[update:1000] date +"%-I:%M%p"
  valign=center
}

# Date

label {
  monitor=
  color=rgba(242, 243, 244, 0.75)
  font_family=JetBrains Mono
  font_size=17
  halign=center
  position=0, 200
  text=cmd[update:1000] echo $(date +"%A, %B %d")
  valign=center
}


