################
### SOURCES ###
################

#-----------------------------------------------------------------------------------------------------------
# IMPORTING FILE WITH BORDER COLOR
#-----------------------------------------------------------------------------------------------------------

# for ags/astal layer
layerrule = blur ,gtk-layer-shell
#layerrule = ignorezero, gtk-layer-shell

#source=~/.cache/ignis/material/dark_colors-hyprland.conf

# Animations
source = ~/.config/hypr/animation.conf

# Electron
env = ELECTRON_OZONE_PLATFORM_HINT,auto

### Keybinds
source = ~/.config/hypr/keybinds.conf

### Autostart apps
source = ~/.config/hypr/autostart.conf

### Pugins 
source = ~/.config/hypr/plugins.conf

### Colors
source = ~/.config/hypr/colors.conf

source = ~/.config/hypr/workspaces.conf

################
### MONITORS ###
################


# monitor=,preferred,auto,1  #[Defaults : 'monitor=,preferred,auto,auto' ]
source = ~/.config/hypr/monitors.conf


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = MOZ_ENABLE_WAYLAND,1

env = ELECTRON_OZONE_PLATFORM_HINT,auto

env = XCURSOR_THEME, Bibata-Modern-Ice

env = XCURSOR_SIZE,24

env = HYPRCURSOR_SIZE,24

env = XDG_CURRENT_DESKTOP,Hyprland

env = XDG_SESSION_DESKTOP,Hyprland

env = XDG_SESSION_TYPE,wayland

env = CLUTTER_BACKEND,wayland

env = GDK_BACKEND,wayland,x11

env = QT_AUTO_SCREEN_SCALE_FACTOR,1

env = QT_QPA_PLATFORM,wayland;xcb

env = QT_QPA_PLATFORMTHEME,qt5ct

env = QT_QPA_PLATFORMTHEME,qt6ct

env = QT_SCALE_FACTOR,1

env = QT_STYLE_OVERRIDE,kvantum 

env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1



#####################
### LOOK AND FEEL ###
#####################

general {

    gaps_in = 5
    gaps_out = 7

    border_size = 2

    col.active_border = $inverse_primary $primary 45deg
    col.inactive_border = $background

    resize_on_border = true
    extend_border_grab_area = true

    allow_tearing = false

    layout = dwindle

    snap{
      enabled = true
    }
}


decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.9

    # drop_shadow = true
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)

    blur {
        enabled = true
        size = 9
        passes = 3
        ignore_opacity = true
        xray = false
        new_optimizations = true
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

# animation for rofi layer / notifications
layerrule = animation slide, rofi
layerrule = animation slide, notifications

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Remove the right-click menu blurring in Chromium browsers
windowrulev2 = noblur, class:^()$, title:^()$

windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
windowrulev2 = workspace 3, class:^(Spotify)$
#windowrule = floating, class:^(Edz Themes)$


windowrulev2 = float, class:(Settings)
windowrulev2 = float, class:(waypaper)
windowrulev2 = float, class:(edzthemes)
windowrulev2 = float, class:(org.gnome.Calculator)
windowrulev2 = float, size 800 800, class:(com-abdownloadmanager-desktop-AppKt)

# Blur swaync
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window

layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window

layerrule = ignorealpha 0.5, swaync-control-center
layerrule = ignorealpha 0.5, swaync-notification-window

# Disable borders for swaync
windowrulev2 = noborder, class:(swaync)
