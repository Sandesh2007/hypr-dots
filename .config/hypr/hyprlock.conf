source = colors.conf

# BACKGROUND
background {
    path = $HOME/.cache/current_wallpaper.png
    blur_passes = 2
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2100
    vibrancy_darkness = 0
}


# INPUT FIELD
input-field {
    monitor =
    size = 300, 40
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $primary_fixed_dim
    inner_color = $primary
    font_color = $surface_container_low
    fade_on_empty = true
    placeholder_text = Enter password...
    hide_input = false
    position = 0, 150
    halign = center
    valign = bottom
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%I")"
    color = $primary
    font_family = JetBrainsMono Bold
    font_size = 180
    position = 0, 150
    halign = center
    valign = center
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = $onSurface
    font_family = JetBrainsMono Bold
    font_size = 180
    position = 0, -75
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%a, %b %d")"
    color = $onSurface
    font_family = JetBrainsMono Bold
    position = 100, -100
    halign = left
    valign = top
}

# Battery percentage
label {
    monitor =
    color = $onSurface
    font_family = JetBrainsMono Bold
    text = cmd[update:5000] echo "Battery: <span>$(get_battery_percentage.sh percentage) </span>"
    position = 100, -140
    halign = left
    valign = top
}
